services:
  gateway:
    build:
      context: ../src
      dockerfile: Gateway/ApiGateway/Dockerfile
    container_name: taskflow-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Clusters__tasks-cluster__Destinations__destination1__Address: http://tasks-api:8080/
      ReverseProxy__Clusters__users-cluster__Destinations__destination1__Address: http://users-api:8080/
      ReverseProxy__Clusters__catalog-cluster__Destinations__destination1__Address: http://catalog-api:8080/
      ReverseProxy__Clusters__inventory-cluster__Destinations__destination1__Address: http://inventory-api:8080/
      ReverseProxy__Clusters__basket-cluster__Destinations__destination1__Address: http://basket-api:8080/
    ports:
      - "8000:8080"
    depends_on:
      - tasks-api
      - users-api
      - catalog-api
      - inventory-api
      - basket-api

  tasks-api:
    build:
      context: ../src
      dockerfile: Services/TaskService/Dockerfile
    container_name: taskflow-tasks-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__TaskDatabase: Host=postgres;Port=5432;Database=taskflow;Username=postgres;Password=postgres
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Jwt__Key: dev-only-insecure-signing-key-change-me-32bytes
      Jwt__Issuer: TaskManager
      Jwt__Audience: TaskManager
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  users-api:
    build:
      context: ../src
      dockerfile: Services/UserService/Dockerfile
    container_name: taskflow-users-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__UserDatabase: Host=postgres-users;Port=5432;Database=userflow;Username=postgres;Password=postgres
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Jwt__Key: dev-only-insecure-signing-key-change-me-32bytes
      Jwt__Issuer: TaskManager
      Jwt__Audience: TaskManager
    ports:
      - "8081:8080"
    depends_on:
      postgres-users:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  catalog-api:
    build:
      context: ../src
      dockerfile: Services/CatalogService/Dockerfile
    container_name: taskflow-catalog-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CatalogDatabase: Host=postgres-catalog;Port=5432;Database=catalogflow;Username=postgres;Password=postgres
      Jwt__Key: dev-only-insecure-signing-key-change-me-32bytes
      Jwt__Issuer: TaskManager
      Jwt__Audience: TaskManager
    ports:
      - "8082:8080"
    depends_on:
      postgres-catalog:
        condition: service_healthy

  inventory-api:
    build:
      context: ../src
      dockerfile: Services/InventoryService/Dockerfile
    container_name: taskflow-inventory-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__InventoryDatabase: Host=postgres-inventory;Port=5432;Database=inventoryflow;Username=postgres;Password=postgres
      Jwt__Key: dev-only-insecure-signing-key-change-me-32bytes
      Jwt__Issuer: TaskManager
      Jwt__Audience: TaskManager
    ports:
      - "8083:8080"
    depends_on:
      postgres-inventory:
        condition: service_healthy

  basket-api:
    build:
      context: ../src
      dockerfile: Services/BasketService/Dockerfile
    container_name: taskflow-basket-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Redis: redis:6379
      Jwt__Key: dev-only-insecure-signing-key-change-me-32bytes
      Jwt__Issuer: TaskManager
      Jwt__Audience: TaskManager
    ports:
      - "8084:8080"
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: taskflow-postgres
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - taskflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-users:
    image: postgres:17
    container_name: taskflow-postgres-users
    environment:
      POSTGRES_DB: userflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - taskflow-postgres-users-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d userflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-catalog:
    image: postgres:17
    container_name: taskflow-postgres-catalog
    environment:
      POSTGRES_DB: catalogflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - taskflow-postgres-catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalogflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-inventory:
    image: postgres:17
    container_name: taskflow-postgres-inventory
    environment:
      POSTGRES_DB: inventoryflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - taskflow-postgres-inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventoryflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: taskflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  taskflow-postgres-data:
  taskflow-postgres-users-data:
  taskflow-postgres-catalog-data:
  taskflow-postgres-inventory-data:
