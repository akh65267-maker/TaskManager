apiVersion: 1

# Dashboards are provisioned from files committed to this repository rather than
# created in the UI, so they survive the Grafana container being recreated and
# show up in code review.
providers:
  - name: taskmanager
    type: file
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
